; Чтобы `pytest` работал напрямую, а не только через `python -m pytest`.
;
; Разница неочевидна и стоила ложного прогона: `python -m pytest` кладёт
; текущий каталог в sys.path, а вызов бинаря `pytest` — нет. Пакет `neftegaz`
; в venv не установлен (pyproject в проекте нет), поэтому импорт падал с
; ModuleNotFoundError у ОДНОГО из двух способов запуска. Такая ловушка
; обязана быть закрыта настройкой, а не памятью о том, как правильно звать.
[pytest]
pythonpath = .
testpaths = tests
