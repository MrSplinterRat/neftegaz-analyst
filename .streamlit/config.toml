# Настройки интерфейса, относящиеся к ПРОДУКТУ, а не к машине разработчика.
#
# ★toolbarMode = "viewer" убирает кнопку «Deploy» и меню разработчика.
# Кнопка эта не наша: её рисует сам Streamlit и зовёт она в Streamlit Community
# Cloud — чужой хостинг, к которому продукт отношения не имеет. В интерфейсе,
# который открывает заказчик, она в лучшем случае недоумение, в худшем —
# приглашение выложить корпус отчётов на чужую площадку.
#
# Именно "viewer", а не "minimal": меню остаётся, и в нём остаётся полезное
# зрителю — «Rerun», «Settings» с переключением темы и ширины. Уходят только
# пункты разработчика и деплой.
[client]
toolbarMode = "viewer"

# Сбор статистики выключен и здесь, не только флагом в Dockerfile: при запуске
# из исходников (streamlit run ui/app.py) флага нет, и умолчание Streamlit
# отправляло бы телеметрию наружу.
[browser]
gatherUsageStats = false

# Тёмная тема по умолчанию не навязывается: у Streamlit она берётся из настроек
# системы, и переопределять это значит спорить с выбором пользователя.
