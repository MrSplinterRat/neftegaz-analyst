# Приёмка питона машиной, а не глазами — тот же принцип, что в exlayout/check.sh.
#
# Отдельный ruff.toml, а не секция в pyproject.toml: pyproject в проекте нет,
# и заводить его ради линтера значит попутно объявить пакет, метаданные и
# сборку — решение куда более широкое, чем «включить проверку».
#
#   .venv/bin/ruff check .        — линты
#   .venv/bin/ruff format --diff  — форма (не применяем молча)

target-version = "py313"
line-length = 100
extend-exclude = ["vendor", "data", "demo*", "html", "ui", ".venv"]

[lint]
select = [
    "E", "W",   # pycodestyle
    "F",        # pyflakes: неиспользуемое, неопределённое
    "I",        # порядок импортов
    "B",        # bugbear: настоящие ловушки, а не вкусовщина
    "UP",       # устаревшие конструкции
    "C4",       # лишние comprehension-обёртки
    "RET",      # возвраты
    "SIM",      # упрощения
    "ARG",      # неиспользуемые аргументы
    "PIE",
    "BLE",      # ★голый except — проглоченный отказ, наш главный враг
    "A",        # затенение встроенных имён
]
# ★ЗДЕСЬ ТОЛЬКО ТО, ЧТО МЫ ОТВЕРГАЕМ ВЕЗДЕ. Точечное исключение живёт прагмой
# в самом коде (`# noqa: КОД — причина`), а не тут: иначе причина отрывается от
# места и через месяц никто не скажет, чинить это или так и задумано.
ignore = [
    "E501",     # длину строки держит форматтер, дублировать отказом не нужно
    "SIM108",   # тернарник вместо if/else — вкусовщина, читаемость страдает чаще
    "RET504",   # имя для результата перед return — законная документация шага,
                # а не лишнее присваивание
    "ARG005",   # лямбда, игнорирующая свой аргумент, — обычная форма заглушки
                # под чужую сигнатуру; ARG001 для настоящих функций оставлен
]

[lint.per-file-ignores]
"tests/*" = ["B011"]   # assert False в тесте — нормальный способ сказать «сюда не дойти»
