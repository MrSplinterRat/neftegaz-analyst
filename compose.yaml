# Штатный запуск со всеми мерами защиты.
#
#     cp .env.example .env      # ключи и адрес модели
#     docker compose up
#
# ★ЗАЧЕМ ЭТОТ ФАЙЛ СУЩЕСТВУЕТ.
#
# Меры защиты — неизменяемая корневая ФС, снятые возможности ядра, запрет
# повышения привилегий, потолки памяти и процессора, публикация порта только на
# петлевой интерфейс — задаются флагами запуска. То есть до появления этого
# файла они действовали ровно настолько, насколько развёртывающий не забыл
# скопировать длинную команду из отчёта. Мера, которая применяется по памяти,
# и мера, которая применяется по умолчанию, — разные меры, сколько бы одинаково
# они ни выглядели в документе.
#
# Здесь они лежат в репозитории, версионируются вместе с кодом и применяются
# сами. Чтобы их снять, теперь нужно ДЕЙСТВИЕ — правка этого файла, видимая в
# истории, — а не забывчивость.
#
# ★Проверять применённость мерами не на слово: `docker compose exec analyst
# sh scripts/check_hardening.sh` печатает шесть строк и возвращает 0 или 1.
# Каждая его проверка различает режимы запуска — это отдельно замерено
# запуском контейнера с флагами и без них.

services:
  analyst:
    build: .
    image: neftegaz-analyst:latest

    # Порт открыт только для самой машины. `8501:8501` без адреса выпустил бы
    # интерфейс — вместе со всем корпусом заказчика — на все интерфейсы хоста,
    # а аутентификации у Streamlit нет.
    ports:
      - "127.0.0.1:8501:8501"

    # Ключи и адрес модели. Файла нет в репозитории намеренно; на свежем
    # чекауте запуск остановится здесь, а не поднимет систему без настроек.
    env_file:
      - .env

    # Корневая ФС неизменяема. Всё, что приложению нужно писать, лежит в двух
    # местах: смонтированный том с данными и временный каталог в памяти.
    read_only: true
    tmpfs:
      - /tmp

    # ★Владелец тома обязан совпадать с пользователем контейнера, иначе Qdrant
    # не откроет файл блокировки. Это выяснилось прогоном: контейнер поднимался,
    # переходил в «здоров» и падал на первом же запросе. Образ работает от
    # uid 1000; если каталог data принадлежит другому пользователю, задайте
    # UID/GID в .env — подстановка ниже возьмёт их оттуда.
    user: "${UID:-1000}:${GID:-1000}"

    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true

    # Потолки взяты с запасом к замеренному пику индексации (12 мин 36 с,
    # 1.4 ГБ на 469 страницах) — самой тяжёлой операции продукта.
    deploy:
      resources:
        limits:
          memory: 6g
          cpus: "4"
    # Docker Compose вне режима swarm читает потолки из полей верхнего уровня,
    # а не из `deploy`. Оба набора оставлены намеренно: без первого меры
    # молча не применились бы при обычном `docker compose up`, без второго —
    # при развёртывании в swarm. ⚠Значения обязаны совпадать; расходятся они
    # тихо, и заметить это можно только проверкой `check_hardening.sh`.
    mem_limit: 6g
    cpus: 4.0

    # Корпус, индекс, кэш модели и база разговоров живут в томе, а не в образе:
    # артефакт сборки не должен становиться носителем данных заказчика.
    volumes:
      - ./data:/app/data

    restart: unless-stopped
